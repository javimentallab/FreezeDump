name: PSScriptAnalyzer

# CodeQL covers the C# but not PowerShell, and the scripts are what runs elevated.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * 1'   # Mondays 05:41 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze the PowerShell scripts
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Get PSScriptAnalyzer
        shell: pwsh
        run: |
          $modules = Join-Path $env:RUNNER_TEMP 'modules'
          New-Item -ItemType Directory -Force -Path $modules | Out-Null
          Save-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Repository PSGallery -Path $modules -Force

      - name: Run PSScriptAnalyzer, fail on errors or warnings
        shell: pwsh
        run: ./tests/run-analyzer.ps1 -ModulePath (Join-Path $env:RUNNER_TEMP 'modules') -SarifPath analyzer-results.sarif

      - name: Upload results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: analyzer-results.sarif
          category: psscriptanalyzer
